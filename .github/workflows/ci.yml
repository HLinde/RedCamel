# Basic CI setup: Lint with ruff, run tests with pytest
name: Test

on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
            lfs: true
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
            enable-cache: "auto"
            cache-python: "true"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --diff .
      - name: Prettier format
        run: npx prettier --check "**/*.md"
      - name: Setup imagemagick
        uses: mfinelli/setup-imagemagick@7bcb45380be40873a59cc0d4a457ec9228b6c84c # v8.0.0
      - name: Check images
        run: find . -not -path "*/.*" -name "*.png" -exec magick identify {} +

  test:
    needs: lint
    name: Run tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
            lfs: true
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
            enable-cache: "auto"
            cache-python: "true"
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk
      - name: Run pytest with coverage
        run: uv run pytest --cov=src --cov-report=term --cov-report=xml
      - name: Test package building
        run: uv build
